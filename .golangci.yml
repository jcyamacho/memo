version: "2"

linters:
  enable:
    - depguard
    - usetesting

  settings:
    depguard:
      rules:
        internal-pkg-boundary:
          files:
            - "**/internal/pkg/**/*.go"
          list-mode: lax
          deny:
            - pkg: "github.com/jcyamacho/memo/internal"
              desc: "internal/pkg may only import stdlib, external modules, or internal/pkg"
          allow:
            - "github.com/jcyamacho/memo/internal/pkg"
    usetesting:
      context-background: true
      context-todo: true

formatters:
  enable:
    - gofmt
